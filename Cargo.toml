[package]
name = "learning-rust-and-vulkan"
version = "26.4.1-dev"
edition = "2024"

[dependencies]
winit = "0.30.13"
vulkano = { version = "0.35.2", features = ["macros"]}
vulkano-shaders = "0.35.0"
image = "0.25.10"
glam = "0.33.1"
rand = "0.10.1"

noise = "0.9.0"
bincode = "1.3.3"
typetag = "0.2.22"
serde = { version = "1.0.228", features = ["derive"] }

[profile.dev]
opt-level = 1